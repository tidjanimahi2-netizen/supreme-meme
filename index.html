<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой сайт</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
}

header{
    background:#4f46e5;
    color:white;
    padding:60px 20px;
}

.btn{
    display:inline-block;
    background:white;
    color:#4f46e5;
    padding:12px 24px;
    border-radius:10px;
    text-decoration:none;
    margin-top:15px;
}

section{
    padding:40px 20px;
}

.card{
    background:white;
    max-width:500px;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<header>
    <h1>Добро пожаловать!</h1>
    <p>Это мой личный сайт</p>
    <a href="#about" class="btn">Узнать больше</a>
</header>

<section id="about">
    <div class="card">
        <h2>Обо мне</h2>
        <p>Я изучаю программирование и создаю сайты.</p>
    </div>

    <div class="card">
        <h2>Контакты</h2>
        <p>Email: example@gmail.com</p>
    </div>
</section>

</body>
</html>
